<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- White background -->
    <rect id="bg" width="512" height="512" fill="#FFFFFF"/>

    <!-- Gold gradient (matching the photo) -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#F5E27A"/>
      <stop offset="25%"  stop-color="#D4AF37"/>
      <stop offset="50%"  stop-color="#B8891A"/>
      <stop offset="75%"  stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#9A6E10"/>
    </linearGradient>

    <!-- Subtle bevel / inner highlight -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFF0A0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#7A5200" stop-opacity="0.5"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="3" dy="4" stdDeviation="6" flood-color="#7A5200" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="#FFFFFF"/>

  <!-- ── F letter (left) ── -->
  <g filter="url(#shadow)">
    <!-- F vertical stem -->
    <rect x="72" y="110" width="52" height="292" rx="4" fill="url(#goldGrad)"/>
    <!-- F top bar -->
    <rect x="72" y="110" width="175" height="52" rx="4" fill="url(#goldGrad)"/>
    <!-- F middle bar -->
    <rect x="72" y="218" width="145" height="46" rx="4" fill="url(#goldGrad)"/>
    <!-- Highlight overlay on F -->
    <rect x="72" y="110" width="175" height="52" rx="4" fill="url(#goldHighlight)" opacity="0.4"/>
  </g>

  <!-- ── A letter (right) ── -->
  <g filter="url(#shadow)">
    <!-- A left leg -->
    <polygon points="240,402 288,402 340,110 292,110" fill="url(#goldGrad)"/>
    <!-- A right leg -->
    <polygon points="368,402 416,402 364,110 316,110" fill="url(#goldGrad)"/>
    <!-- A crossbar -->
    <rect x="268" y="262" width="120" height="44" rx="4" fill="url(#goldGrad)"/>
    <!-- Highlights -->
    <polygon points="240,402 288,402 340,110 292,110" fill="url(#goldHighlight)" opacity="0.3"/>
  </g>

  <!-- ── Fleur-de-lis ornament (between F and A) ── -->
  <g transform="translate(218,230) scale(0.9)" fill="url(#goldGrad)" filter="url(#shadow)">
    <!-- Centre petal -->
    <ellipse cx="0" cy="-28" rx="9" ry="22"/>
    <!-- Left petal -->
    <ellipse cx="-18" cy="-12" rx="22" ry="9" transform="rotate(-30,-18,-12)"/>
    <!-- Right petal -->
    <ellipse cx="18" cy="-12" rx="22" ry="9" transform="rotate(30,18,-12)"/>
    <!-- Stem -->
    <rect x="-5" y="-5" width="10" height="38" rx="3"/>
    <!-- Base crossbar -->
    <rect x="-18" y="30" width="36" height="8" rx="4"/>
    <!-- Tip ball -->
    <circle cx="0" cy="-48" r="7"/>
  </g>
</svg>